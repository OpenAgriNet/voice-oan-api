services:
  app:
    container_name: amul_voice_app
    build:
      context: .
      # For the release stamp: GIT_SHA=$(git rev-parse HEAD) docker compose build.
      # The checkout mounted below is read first, so a running container still
      # reports the code it runs.
      args:
        GIT_SHA: ${GIT_SHA:-}
    ports:
      - "8003:8003"
    expose:
      - "8003"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
    restart: unless-stopped
    networks:
      - amul-network
      
networks:
  amul-network:
    external: true