models:
  gemma_vllm:
    kind: vllm
    model_name: ${AGRINET_GEMMA_MODEL_NAME}
    base_url: ${AGRINET_GEMMA_BASE_URL}
    api_key: ${AGRINET_GEMMA_API_KEY}
    fallback:
      to: azure_gpt54_mini
      on_error: [ModelHTTPError, APIConnectionError, TransportError, TimeoutError, UnexpectedModelBehavior]
      on_concurrency_above: ${AGRINET_GEMMA_MAX_CONCURRENCY}
      metrics_cache_ttl: 2

  azure_gpt54_mini:
    kind: azure-openai
    api: responses
    model_name: gpt-5.4-mini
    settings:
      openai_reasoning_effort: none
    base_url: ${AZURE_GPT54_MINI_BASE_URL}
    api_key: ${AZURE_GPT54_MINI_API_KEY}

use_cases:
  voice:
    default_alias: azure_gpt54_mini
    aliases: [gemma_vllm, azure_gpt54_mini]
    proportions: ["${VOICE_PROPORTION_GEMMA_VLLM}", "${VOICE_PROPORTION_AZURE_GPT54_MINI}"]
    routing_ttl_seconds: 7200
    timeout_seconds: 45
