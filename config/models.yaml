models:
  gemma_vllm:
    kind: vllm
    model_name: ${AGRINET_GEMMA_MODEL_NAME}
    base_url: ${AGRINET_GEMMA_BASE_URL}
    api_key: ${AGRINET_GEMMA_API_KEY}
    fallback:
      to: luna_gpt
      on_error: [ModelHTTPError, TimeoutError]
      on_concurrency_above: 10
      metrics_cache_ttl: 2

  luna_gpt:
    kind: openai
    api: responses
    model_name: ${LUNA_MODEL_NAME}
    base_url: ${LUNA_BASE_URL}
    api_key: ${LUNA_API_KEY}

use_cases:
  voice:
    default_alias: luna_gpt
    aliases: [gemma_vllm, luna_gpt]
    proportions: [90, 10]
    routing_ttl_seconds: 7200
    timeout_seconds: 45
