name: telemetry

# Runs deterministic telemetry and glossary checks on every PR. Broader suites
# that require service/model access remain outside this workflow.
on:
  pull_request:
  push:
    branches: [amul-dev, amul-prod]

jobs:
  glossary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m helpers.glossary_validation

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # What amul-oan-api reads, for tests/test_voice_telemetry_readers.py.
      - uses: actions/checkout@v4
        with:
          repository: OpenAgriNet/amul-oan-api
          ref: main
          path: amul-oan-api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest pyyaml
      - run: python -m pytest -q tests/test_voice_telemetry_schema_stamps.py tests/test_voice_telemetry_contract.py tests/test_voice_telemetry_readers.py
        env:
          AMUL_OAN_API_PATH: amul-oan-api
