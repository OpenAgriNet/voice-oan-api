name: telemetry

# Runs the telemetry contract tests on every PR. The rest of the suite needs
# model credentials, so it isn't run here yet.
on:
  pull_request:
  push:
    branches: [amul-dev, amul-prod]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_voice_telemetry_schema_stamps.py tests/test_voice_telemetry_contract.py
