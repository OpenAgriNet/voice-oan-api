name: Prompt and skill contract
on:
  pull_request:
    branches: [bh-voice-prod, bh-voice-dev]
  push:
    branches: [bh-voice-prod, bh-voice-dev]
permissions:
  contents: read
jobs:
  prompt-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline contract dependencies
        run: >-
          python -m pip install --only-binary=:all:
          Jinja2==3.1.6 pydantic-ai-slim[openai]==2.59.0
          python-decouple==3.8 PyYAML==6.0.3 pytest==9.1.1
      - name: Validate every language and native capability loading
        env:
          PYDANTIC_AI_NO_BANNER: '1'
          OTEL_SDK_DISABLED: 'true'
        run: python -m pytest tests/test_prompt_structure.py tests/test_capabilities.py tests/test_native_skills.py -q
